name: Build and Push Device Trust Mesh Images

on:
  push:
    branches: [main]
    tags: ['device-trust-mesh-v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: device-trust-mesh-build-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      simulator_changed: ${{ steps.filter.outputs.simulator }}
      ray_changed: ${{ steps.filter.outputs.ray }}
      repo_version: ${{ steps.version.outputs.repo_version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve shared repo version
        id: version
        run: |
          set -euo pipefail
          if ! RAW_TAG=$(git describe --tags --match 'device-trust-mesh-v*' --abbrev=0 2>/dev/null); then
            echo "::warning::No device-trust-mesh-v* tag reachable from this checkout — using v0.0.0. Cut a release with a device-trust-mesh-v* tag."
            RAW_TAG=device-trust-mesh-v0.0.0
          fi
          REPO_VERSION=${RAW_TAG#device-trust-mesh-}
          VERSION_TAG="${REPO_VERSION}-$(date -u +%Y%m%d%H%M)"
          echo "Resolved repo_version=$REPO_VERSION (from tag $RAW_TAG)"
          echo "Resolved version_tag=$VERSION_TAG"
          echo "repo_version=$REPO_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            simulator:
              - 'device-trust-mesh/dtm/**'
              - 'device-trust-mesh/pyproject.toml'
              - 'device-trust-mesh/.dockerignore'
              - 'device-trust-mesh/Dockerfile.simulator'
              - '.github/workflows/device-trust-mesh-build-images.yml'
            ray:
              - 'device-trust-mesh/dtm/**'
              - 'device-trust-mesh/pyproject.toml'
              - 'device-trust-mesh/.dockerignore'
              - 'device-trust-mesh/Dockerfile.ray'
              - '.github/workflows/device-trust-mesh-build-images.yml'

  simulator-image:
    needs: preflight
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/device-trust-mesh-v') ||
      needs.preflight.outputs.simulator_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: device-trust-mesh
          file: device-trust-mesh/Dockerfile.simulator
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            quay.io/osowski/device-trust-mesh-simulator:${{ needs.preflight.outputs.version_tag }}
            quay.io/osowski/device-trust-mesh-simulator:latest
          cache-from: type=gha,scope=dtm-simulator-image
          cache-to: type=gha,mode=max,scope=dtm-simulator-image

      - name: Verify pushed manifest is multi-arch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          WANT="linux/amd64,linux/arm64"
          TAG="quay.io/osowski/device-trust-mesh-simulator:${{ needs.preflight.outputs.version_tag }}"
          RAW=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Manifests}}')
          HAVE=$(echo "$RAW" | jq -r '[.[].platform | select(.os=="linux") | "linux/" + .architecture] | unique | join(",")')
          echo "Pushed manifest platforms: $HAVE"
          MISSING=$(comm -23 <(echo "$WANT" | tr ',' '\n' | sort -u) <(echo "$HAVE" | tr ',' '\n' | sort -u))
          if [ -n "$MISSING" ]; then
            echo "::error::Published manifest for $TAG is missing platform(s): $(echo "$MISSING" | tr '\n' ' ') (wanted: $WANT, have: $HAVE)"
            exit 1
          fi
          echo "Verified: all wanted platforms ($WANT) present in $TAG"

  ray-image:
    needs: preflight
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/device-trust-mesh-v') ||
      needs.preflight.outputs.ray_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: device-trust-mesh
          file: device-trust-mesh/Dockerfile.ray
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            quay.io/osowski/device-trust-mesh-ray:${{ needs.preflight.outputs.version_tag }}
            quay.io/osowski/device-trust-mesh-ray:latest
          cache-from: type=gha,scope=dtm-ray-image
          cache-to: type=gha,mode=max,scope=dtm-ray-image

      - name: Verify pushed manifest is multi-arch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          WANT="linux/amd64,linux/arm64"
          TAG="quay.io/osowski/device-trust-mesh-ray:${{ needs.preflight.outputs.version_tag }}"
          RAW=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest.Manifests}}')
          HAVE=$(echo "$RAW" | jq -r '[.[].platform | select(.os=="linux") | "linux/" + .architecture] | unique | join(",")')
          echo "Pushed manifest platforms: $HAVE"
          MISSING=$(comm -23 <(echo "$WANT" | tr ',' '\n' | sort -u) <(echo "$HAVE" | tr ',' '\n' | sort -u))
          if [ -n "$MISSING" ]; then
            echo "::error::Published manifest for $TAG is missing platform(s): $(echo "$MISSING" | tr '\n' ' ') (wanted: $WANT, have: $HAVE)"
            exit 1
          fi
          echo "Verified: all wanted platforms ($WANT) present in $TAG"
