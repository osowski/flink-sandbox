apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yt-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/osowski/flink-sandbox
    targetRevision: HEAD
    path: youtube-history/gitops/argo
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
