apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: yt-enricher-confluent-creds
  namespace: flink
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: yt-enricher-confluent-creds
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_API_KEY
      remoteRef:
        key: /yt-pipeline/confluent/enricher
        property: kafka_api_key
    - secretKey: KAFKA_API_SECRET
      remoteRef:
        key: /yt-pipeline/confluent/enricher
        property: kafka_api_secret
    - secretKey: SR_API_KEY
      remoteRef:
        key: /yt-pipeline/confluent/enricher
        property: sr_api_key
    - secretKey: SR_API_SECRET
      remoteRef:
        key: /yt-pipeline/confluent/enricher
        property: sr_api_secret
