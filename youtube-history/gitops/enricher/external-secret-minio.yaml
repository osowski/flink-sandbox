apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: yt-minio-creds
  namespace: flink
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: yt-minio-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /yt-pipeline/minio/credentials
        property: access_key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /yt-pipeline/minio/credentials
        property: secret_key
