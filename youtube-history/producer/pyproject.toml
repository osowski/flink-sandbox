[project]
name = "yt-producer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka[avro]>=2.6",
    "fastavro>=1.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[secretsmanager]>=5.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
